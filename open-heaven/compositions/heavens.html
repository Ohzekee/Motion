<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #14234a;
    }
    #heavens-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
  </style>
  <div id="root" data-composition-id="heavens" data-width="1920" data-height="1080">
    <canvas id="heavens-canvas" width="1920" height="1080"></canvas>
  </div>
  <script>
    (function () {
      const DUR = 20;
      const W = 1920;
      const H = 1080;
      const CX = 960;
      const canvas = document.getElementById("heavens-canvas");
      let ctx = canvas.getContext("2d");
      const reflCanvas = document.createElement("canvas");
      reflCanvas.width = 1920;
      reflCanvas.height = 1080;
      const rctx = reflCanvas.getContext("2d");

      // ---------- helpers ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const lerp = (a, b, p) => a + (b - a) * p;
      const E = {
        inOut2: (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2),
        in3: (p) => p * p * p,
        out3: (p) => 1 - Math.pow(1 - p, 3),
        outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
        sine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
      };
      function hash(a, b = 0, c = 0) {
        let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2246822519)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }
      function hex(c) {
        const n = parseInt(c.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }
      function mix(a, b, p) {
        return [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
      }
      function rgb(c, a = 1) {
        return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
      }
      function radialFill(x, y, r, stops, rect) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        stops.forEach(([o, c]) => g.addColorStop(o, c));
        ctx.fillStyle = g;
        ctx.fillRect(rect[0], rect[1], rect[2], rect[3]);
      }

      // ---------- world 0: the night sky and the door (Rev 4:1) ----------
      const DOOR_TOP = 140;
      const DOOR_BOTTOM = 760;
      const DOOR_W = 340;
      const ZOOM_CY = 450;
      const stars = [];
      for (let i = 0; i < 210; i++) {
        stars.push({
          x: hash(i, 1) * W,
          y: Math.pow(hash(i, 2), 1.3) * 760,
          r: 0.6 + hash(i, 3) * 1.4,
          a: 0.3 + hash(i, 4) * 0.6,
        });
      }
      const hills = [];
      for (let x = -40; x <= W + 40; x += 20) {
        const y =
          808 +
          26 * Math.sin(x * 0.0031 + 1.3) +
          14 * Math.sin(x * 0.0083 + 0.4) +
          6 * Math.sin(x * 0.021 + 2.2);
        hills.push([x, y]);
      }
      function doorPath(w) {
        const hw = w / 2;
        ctx.moveTo(CX - hw, DOOR_BOTTOM);
        ctx.lineTo(CX - hw, DOOR_TOP + hw);
        ctx.arc(CX, DOOR_TOP + hw, hw, Math.PI, 0);
        ctx.lineTo(CX + hw, DOOR_BOTTOM);
        ctx.closePath();
      }
      function drawSky(t) {
        const open = E.outExpo(prog(t, 2.6, 3.4));
        const w = DOOR_W * open;
        const z = Math.exp(Math.log(16) * E.in3(prog(t, 3.4, 4.65)));
        ctx.save();
        ctx.translate(CX, ZOOM_CY);
        ctx.scale(z, z);
        ctx.translate(-CX, -ZOOM_CY);
        ctx.beginPath();
        ctx.rect(-6000, -6000, 14000, 14000);
        if (w > 0.5) doorPath(w);
        ctx.clip("evenodd");
        radialFill(CX, 940, 1350, [[0, "#3b3350"], [0.42, "#14234a"], [1, "#0a1330"]], [0, 0, W, H]);
        ctx.fillStyle = "#f4ebd0";
        for (const s of stars) {
          ctx.globalAlpha = s.a;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#070b18";
        ctx.beginPath();
        ctx.moveTo(-40, H + 10);
        hills.forEach(([x, y]) => ctx.lineTo(x, y));
        ctx.lineTo(W + 40, H + 10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // the gold seam, then the gold rim of the opened door
        ctx.save();
        ctx.translate(CX, ZOOM_CY);
        ctx.scale(z, z);
        ctx.translate(-CX, -ZOOM_CY);
        const sw = 1.5 + 3.5 * E.sine(prog(t, 0, 2.6));
        if (w < 1.5) {
          ctx.fillStyle = "#d9b45a";
          ctx.fillRect(CX - sw * 1.1, DOOR_TOP, sw * 2.2, DOOR_BOTTOM - DOOR_TOP);
          ctx.fillStyle = "#fff6de";
          ctx.fillRect(CX - sw * 0.4, DOOR_TOP + 4, sw * 0.8, DOOR_BOTTOM - DOOR_TOP - 8);
        } else {
          ctx.strokeStyle = "#d9b45a";
          ctx.lineWidth = Math.max(3, sw * 1.4);
          ctx.beginPath();
          doorPath(w);
          ctx.stroke();
        }
        ctx.restore();
      }

      // ---------- world 1: the firmament, a vault of crystal (Ezek 1:22) ----------
      const CRY_CY = 480;
      const R0 = 60;
      const G = 1.32;
      const SECT = 20;
      const crystalColors = ["#dcebf2", "#a9c7d6", "#f4f1e6", "#c4dce6", "#8fb3c6", "#e8f0ec"].map(hex);
      const LIGHT = hex("#fff8e6");
      function crystalDepth(t) {
        return 0.75 * t + 1.8 * E.inOut2(prog(t, 3.4, 4.8)) + 2.6 * E.in3(prog(t, 6.9, 8.05));
      }
      function cryVertex(k, s, d) {
        const r = R0 * Math.pow(G, k - d) * (1 + (hash(k, s, 7) - 0.5) * 0.12);
        const a = ((s + (hash(k, s, 3) - 0.5) * 0.35) / SECT) * Math.PI * 2 + k * 0.21;
        return [CX + Math.cos(a) * r, CRY_CY + Math.sin(a) * r, r, a];
      }
      function drawCrystal(t, breaking) {
        const d = crystalDepth(t);
        const phi = -1.2 + 0.5 * t;
        const A = breaking ? 2600 * E.in3(prog(t, 6.9, 8.0)) : -1;
        if (!breaking) {
          ctx.fillStyle = "#fff6de";
          ctx.fillRect(0, 0, W, H);
        } else {
          const la = 1 - prog(t, 6.9, 7.3);
          if (la > 0) {
            ctx.fillStyle = `rgba(255,246,222,${la})`;
            ctx.beginPath();
            ctx.arc(CX, CRY_CY, R0 * Math.pow(G, Math.ceil(d - 8) - d) + 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        const kmin = Math.ceil(d - 8);
        const kmax = Math.floor(d + 15);
        for (let k = kmin; k < kmax; k++) {
          for (let s = 0; s < SECT; s++) {
            const p00 = cryVertex(k, s, d);
            const p01 = cryVertex(k, s + 1 === SECT ? 0 : s + 1, d);
            const p11 = cryVertex(k + 1, s + 1 === SECT ? 0 : s + 1, d);
            const p10 = cryVertex(k + 1, s, d);
            if (s + 1 === SECT) {
              p01[3] += Math.PI * 2;
              p11[3] += Math.PI * 2;
            }
            const tris = hash(k, s, 11) > 0.5 ? [[p00, p01, p11], [p00, p11, p10]] : [[p00, p01, p10], [p01, p11, p10]];
            tris.forEach((tri, ti) => {
              let cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3;
              let cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
              const rc = Math.hypot(cx - CX, cy - CRY_CY);
              let alpha = 1;
              let dx = 0;
              let dy = 0;
              let rot = 0;
              if (breaking) {
                const f = clamp((A + 320 - rc) / 640);
                if (f >= 0.98) return;
                const ux = (cx - CX) / (rc || 1);
                const uy = (cy - CRY_CY) / (rc || 1);
                const push = f * f * (420 + 600 * hash(k, s, 20 + ti));
                dx = ux * push;
                dy = uy * push;
                rot = f * (hash(k, s, 30 + ti) - 0.5) * 3;
                alpha = 1 - f;
              }
              const am = (tri[0][3] + tri[1][3] + tri[2][3]) / 3;
              const base = crystalColors[Math.floor(hash(k, s, 40 + ti) * crystalColors.length)];
              const sweep = Math.pow(Math.max(0, Math.cos(am - phi)), 6);
              const toLight = Math.pow(1 - clamp(rc / 760), 2) * 0.8;
              let c = mix(base, LIGHT, clamp(toLight + sweep * 0.55));
              c = mix(c, hex("#6f93a8"), (1 - sweep) * 0.18 * clamp(rc / 900));
              ctx.save();
              ctx.globalAlpha = alpha;
              ctx.translate(cx + dx, cy + dy);
              ctx.rotate(rot);
              ctx.beginPath();
              ctx.moveTo(tri[0][0] - cx, tri[0][1] - cy);
              ctx.lineTo(tri[1][0] - cx, tri[1][1] - cy);
              ctx.lineTo(tri[2][0] - cx, tri[2][1] - cy);
              ctx.closePath();
              ctx.fillStyle = rgb(c);
              ctx.fill();
              ctx.strokeStyle = "rgba(255,255,255,0.6)";
              ctx.lineWidth = clamp(rc / 260, 0.6, 3);
              ctx.stroke();
              ctx.restore();
            });
          }
        }
      }

      // ---------- world 2: the wheels, a wheel in the middle of a wheel (Ezek 1:15-18) ----------
      const FOC = 1400;
      const RING_R = 800;
      const BAND = 74;
      const SEGS = 120;
      const EYES = 16;
      const LDIR = (() => {
        const v = [-0.45, -0.6, -0.66];
        const n = Math.hypot(...v);
        return v.map((x) => x / n);
      })();
      function rotX(p, a) {
        const c = Math.cos(a), s = Math.sin(a);
        return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c];
      }
      function rotY(p, a) {
        const c = Math.cos(a), s = Math.sin(a);
        return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c];
      }
      function rotZ(p, a) {
        const c = Math.cos(a), s = Math.sin(a);
        return [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]];
      }
      function wheelDist(t) {
        if (t < 8.05) return lerp(3400, 2600, prog(t, 6.9, 8.05));
        if (t < 9.6) return lerp(2600, 2000, E.out3(prog(t, 8.05, 9.6)));
        return lerp(2000, 40, E.in3(prog(t, 9.6, 10.95)));
      }
      const BRONZE_DARK = hex("#3e2b12");
      const BRONZE_LIGHT = hex("#e2c977");
      const BERYL = hex("#8fa46a");
      function drawEye(x, y, s, ang, squash, dim) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        ctx.scale(1, squash);
        ctx.beginPath();
        ctx.moveTo(-s, 0);
        ctx.quadraticCurveTo(0, -s * 0.78, s, 0);
        ctx.quadraticCurveTo(0, s * 0.78, -s, 0);
        ctx.closePath();
        ctx.fillStyle = rgb(mix(hex("#efe8d6"), hex("#3e2b12"), dim));
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = rgb(mix(hex("#2f6f5a"), hex("#1a1a1a"), dim));
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0c0f18";
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.19, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${0.9 * (1 - dim)})`;
        ctx.beginPath();
        ctx.arc(-s * 0.12, -s * 0.12, s * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = "#2a1e10";
        ctx.lineWidth = Math.max(1, s * 0.09);
        ctx.stroke();
        ctx.restore();
      }
      function drawWheels(t) {
        radialFill(CX, 540, 1250, [[0, "#9a6426"], [0.28, "#5a3a2a"], [0.6, "#22284a"], [1, "#14234a"]], [0, 0, W, H]);
        // the fire infolding itself: hard-edged amber arcs turning at constant speed
        ctx.lineCap = "butt";
        for (let i = 0; i < 7; i++) {
          const r = 260 + i * 110;
          const a0 = hash(i, 50) * Math.PI * 2 + t * (0.25 + 0.2 * hash(i, 51)) * (i % 2 ? 1 : -1);
          ctx.strokeStyle = `rgba(232,161,58,${0.14 + 0.1 * hash(i, 52)})`;
          ctx.lineWidth = 26 + 30 * hash(i, 53);
          ctx.beginPath();
          ctx.arc(CX, 540, r, a0, a0 + 0.9 + 1.2 * hash(i, 54));
          ctx.stroke();
        }
        const D = wheelDist(t);
        const spin = 1 - 0.6 * prog(t, 9.6, 10.95);
        const rings = [
          { place: (p) => rotX(rotY(p, 0.55 * t * spin + 0.4), 0.3), normal: (n) => rotX(rotY(n, 0.55 * t * spin + 0.4), 0.3) },
          {
            place: (p) => rotX(rotZ(rotY(p, Math.PI / 2), 0.5 * t * spin + 0.9), 0.3),
            normal: (n) => rotX(rotZ(rotY(n, Math.PI / 2), 0.5 * t * spin + 0.9), 0.3),
          },
        ];
        const items = [];
        const proj = (p) => {
          const zz = p[2] + D;
          return [CX + (FOC * p[0]) / zz, 540 + (FOC * p[1]) / zz, zz];
        };
        rings.forEach((ring, ri) => {
          const N = ring.normal([0, 0, 1]);
          for (let i = 0; i < SEGS; i++) {
            const a0 = (i / SEGS) * Math.PI * 2;
            const a1 = ((i + 1) / SEGS) * Math.PI * 2;
            const p0 = ring.place([RING_R * Math.cos(a0), RING_R * Math.sin(a0), 0]);
            const p1 = ring.place([RING_R * Math.cos(a1), RING_R * Math.sin(a1), 0]);
            if (p0[2] + D < 30 || p1[2] + D < 30) continue;
            const am = (a0 + a1) / 2;
            const n = ring.normal([Math.cos(am), Math.sin(am), 0]);
            const shade = clamp(0.25 + 0.75 * Math.max(0, -(n[0] * LDIR[0] + n[1] * LDIR[1] + n[2] * LDIR[2])));
            const zMid = (p0[2] + p1[2]) / 2;
            items.push({
              z: zMid,
              draw: () => {
                const s0 = proj(p0);
                const s1 = proj(p1);
                const lw = (FOC * BAND) / (zMid + D);
                let c = mix(BRONZE_DARK, BRONZE_LIGHT, shade);
                c = mix(c, BERYL, ri === 1 ? 0.3 : 0.12);
                c = mix(c, hex("#14234a"), clamp(zMid / 1600) * 0.45);
                ctx.strokeStyle = rgb(c);
                ctx.lineWidth = lw + 1;
                ctx.lineCap = "butt";
                ctx.beginPath();
                ctx.moveTo(s0[0], s0[1]);
                ctx.lineTo(s1[0], s1[1]);
                ctx.stroke();
                ctx.strokeStyle = rgb(mix(c, hex("#fff1c8"), 0.55 * shade));
                ctx.lineWidth = lw * 0.12;
                ctx.beginPath();
                ctx.moveTo(s0[0], s0[1]);
                ctx.lineTo(s1[0], s1[1]);
                ctx.stroke();
              },
            });
          }
          for (let e = 0; e < EYES; e++) {
            const a = ((e + 0.5) / EYES) * Math.PI * 2;
            const p = ring.place([RING_R * Math.cos(a), RING_R * Math.sin(a), 0]);
            const q = ring.place([RING_R * Math.cos(a + 0.02), RING_R * Math.sin(a + 0.02), 0]);
            if (p[2] + D < 40 || q[2] + D < 40) continue;
            items.push({
              z: p[2] - 1,
              draw: () => {
                const sp = proj(p);
                const sq = proj(q);
                const size = (FOC * 44) / (p[2] + D);
                if (size < 1.5) return;
                const v = [p[0], p[1], p[2] + D];
                const vn = Math.hypot(...v);
                const facing = 0.3 + 0.7 * Math.abs((N[0] * v[0] + N[1] * v[1] + N[2] * v[2]) / vn);
                drawEye(sp[0], sp[1], size, Math.atan2(sq[1] - sp[1], sq[0] - sp[0]), facing, clamp(p[2] / 1600) * 0.5);
              },
            });
          }
        });
        items.sort((a, b) => b.z - a.z);
        items.forEach((it) => it.draw());
      }

      // ---------- world 3: the sea of glass and the throne (Rev 4:2-6) ----------
      const HZ = 470;
      const CAM_H = 1.0;
      const TILE = 6;
      const TRAVEL = 180;
      const THRONE_Z = TRAVEL + 11;
      function camZ(t) {
        return TRAVEL * E.out3(prog(t, 10.2, 16.5));
      }
      function drawThroneGroup(t, cz) {
        const zr = THRONE_Z - cz;
        const s = FOC / zr;
        const yb = HZ + (FOC * CAM_H) / zr;
        const cy = yb - 1.35 * s;
        // the emerald rainbow round about the throne
        const rp = E.inOut2(prog(t, 14.6, 15.8));
        if (rp > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, -2000, W, yb + 2000);
          ctx.clip();
          const bands = ["#0f5c3d", "#1f8a5b", "#3fb27f", "#7fd1a3", "#cdefd8"];
          ctx.lineCap = "butt";
          bands.forEach((c, i) => {
            ctx.strokeStyle = c;
            ctx.lineWidth = 0.115 * s + 1;
            ctx.beginPath();
            ctx.arc(CX, cy, (2.2 - i * 0.11) * s, -Math.PI / 2 - rp * Math.PI, -Math.PI / 2 + rp * Math.PI);
            ctx.stroke();
          });
          ctx.restore();
        }
        // the four and twenty seats
        const seats = [];
        for (let k = 0; k < 24; k++) {
          const span = (310 / 360) * Math.PI * 2;
          const phi = Math.PI * 1.5 + 0.43 + (k / 23) * span;
          seats.push({ x: 4.6 * Math.cos(phi), z: THRONE_Z + 3.0 * Math.sin(phi) + 0.6 });
        }
        const drawSeat = (st) => {
          const z = st.z - cz;
          const ss = FOC / z;
          const x = CX + (FOC * st.x) / z;
          const y = HZ + (FOC * CAM_H) / z;
          if (ss < 1.2) return;
          ctx.fillStyle = "#8c6a2e";
          ctx.fillRect(x - 0.17 * ss, y - 0.62 * ss, 0.34 * ss, 0.62 * ss);
          ctx.fillStyle = "#f7f3ea";
          ctx.beginPath();
          ctx.moveTo(x - 0.13 * ss, y);
          ctx.lineTo(x + 0.13 * ss, y);
          ctx.lineTo(x + 0.08 * ss, y - 0.42 * ss);
          ctx.lineTo(x - 0.08 * ss, y - 0.42 * ss);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#e6d3b8";
          ctx.beginPath();
          ctx.arc(x, y - 0.49 * ss, 0.065 * ss, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#c99a2e";
          ctx.beginPath();
          ctx.moveTo(x - 0.07 * ss, y - 0.54 * ss);
          ctx.lineTo(x - 0.07 * ss, y - 0.62 * ss);
          ctx.lineTo(x - 0.035 * ss, y - 0.58 * ss);
          ctx.lineTo(x, y - 0.64 * ss);
          ctx.lineTo(x + 0.035 * ss, y - 0.58 * ss);
          ctx.lineTo(x + 0.07 * ss, y - 0.62 * ss);
          ctx.lineTo(x + 0.07 * ss, y - 0.54 * ss);
          ctx.closePath();
          ctx.fill();
        };
        seats.filter((st) => st.z > THRONE_Z).sort((a, b) => b.z - a.z).forEach(drawSeat);
        // the throne: a jasper dais and seat
        const steps = [
          [2.2, "#c9d6c2"],
          [1.7, "#b5c9b0"],
          [1.2, "#a7bfa6"],
        ];
        steps.forEach(([w, c], i) => {
          const y0 = yb - (i + 1) * 0.18 * s;
          ctx.fillStyle = c;
          ctx.fillRect(CX - (w / 2) * s, y0, w * s, 0.18 * s + 0.5);
          ctx.fillStyle = "#eef4ea";
          ctx.fillRect(CX - (w / 2) * s, y0, w * s, Math.max(1, 0.025 * s));
        });
        const top = yb - 2.45 * s;
        const base = yb - 0.54 * s;
        ctx.fillStyle = "#9fb7a0";
        ctx.beginPath();
        ctx.moveTo(CX - 0.62 * s, base);
        ctx.lineTo(CX - 0.62 * s, top + 0.5 * s);
        ctx.lineTo(CX, top);
        ctx.lineTo(CX + 0.62 * s, top + 0.5 * s);
        ctx.lineTo(CX + 0.62 * s, base);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#c9d6c2";
        ctx.beginPath();
        ctx.moveTo(CX, top);
        ctx.lineTo(CX + 0.62 * s, top + 0.5 * s);
        ctx.lineTo(CX + 0.62 * s, base);
        ctx.lineTo(CX, base);
        ctx.closePath();
        ctx.fill();
        // the One upon the throne: no figure, only jasper and sardius light in cut facets
        const rings = [
          [0.98, "#a8322a"],
          [0.78, "#d4644a"],
          [0.58, "#c9d6c2"],
          [0.4, "#eef4ea"],
          [0.22, "#ffffff"],
        ];
        rings.forEach(([r, c], i) => {
          const sides = 16;
          const rot = (i % 2 ? 1 : -1) * 0.05 * t + i * 0.2;
          const col = hex(c);
          for (let j = 0; j < sides; j++) {
            const a0 = rot + (j / sides) * Math.PI * 2;
            const a1 = rot + ((j + 1) / sides) * Math.PI * 2;
            ctx.fillStyle = rgb(mix(col, j % 2 ? [255, 255, 255] : col, 0.18));
            ctx.beginPath();
            ctx.moveTo(CX, cy);
            ctx.lineTo(CX + Math.cos(a0) * r * s, cy + Math.sin(a0) * r * s);
            ctx.lineTo(CX + Math.cos(a1) * r * s, cy + Math.sin(a1) * r * s);
            ctx.closePath();
            ctx.fill();
          }
        });
        seats.filter((st) => st.z <= THRONE_Z).sort((a, b) => b.z - a.z).forEach(drawSeat);
        // the seven lamps of fire burning before the throne
        for (let k = 0; k < 7; k++) {
          const kin = E.outExpo(prog(t, 15.2 + k * 0.11, 15.6 + k * 0.11));
          const z = THRONE_Z - 2.2 - cz;
          const ls = FOC / z;
          const x = CX + (FOC * (-1.8 + k * 0.6)) / z;
          const y = HZ + (FOC * CAM_H) / z;
          if (ls < 1) continue;
          ctx.fillStyle = "#8c6a2e";
          ctx.beginPath();
          ctx.moveTo(x - 0.1 * ls, y - 0.12 * ls);
          ctx.lineTo(x + 0.1 * ls, y - 0.12 * ls);
          ctx.lineTo(x + 0.05 * ls, y);
          ctx.lineTo(x - 0.05 * ls, y);
          ctx.closePath();
          ctx.fill();
          if (kin <= 0) continue;
          const fh = 0.34 * ls * kin * (1 + 0.07 * Math.sin(t * 11 + k * 1.7));
          const fw = 0.08 * ls * kin;
          const fy = y - 0.12 * ls;
          [
            ["#e8a13a", 1],
            ["#fff1c8", 0.55],
          ].forEach(([c, sc]) => {
            ctx.fillStyle = c;
            ctx.beginPath();
            ctx.moveTo(x, fy - fh * sc);
            ctx.quadraticCurveTo(x + fw * sc * 1.4, fy - fh * sc * 0.3, x, fy);
            ctx.quadraticCurveTo(x - fw * sc * 1.4, fy - fh * sc * 0.3, x, fy - fh * sc);
            ctx.closePath();
            ctx.fill();
          });
        }
        return yb;
      }
      function drawSea(t) {
        const cz = camZ(t);
        radialFill(CX, HZ, 1300, [[0, "#fff6de"], [0.22, "#f1e6c4"], [0.6, "#c9d6c2"], [1, "#8fa9b8"]], [0, 0, W, HZ]);
        radialFill(CX, HZ, 1300, [[0, "#eef0e8"], [0.25, "#cfdde0"], [1, "#86a3b3"]], [0, HZ, W, H - HZ]);
        // glass tiles
        const sweepX = lerp(-400, 2400, E.inOut2(prog(t, 16.5, 18.5)));
        const sweepOn = t > 16.5 && t < 18.5;
        const j0 = Math.floor((cz + 2.2) / TILE);
        const j1 = Math.floor((cz + 120) / TILE);
        for (let j = j0; j <= j1; j++) {
          const zn = j * TILE - cz;
          const zf = (j + 1) * TILE - cz;
          if (zf < 2.2) continue;
          const yn = HZ + (FOC * CAM_H) / Math.max(zn, 2.2);
          const yf = HZ + (FOC * CAM_H) / zf;
          const fade = 1 - clamp(zf / 120);
          const imax = Math.ceil((960 * zf) / FOC / TILE) + 1;
          for (let i = -imax; i < imax; i++) {
            const h = hash(i, j, 77);
            const x0 = i * TILE;
            const x1 = x0 + TILE;
            const zz = Math.max(zn, 2.2);
            const q = [
              [CX + (FOC * x0) / zz, yn],
              [CX + (FOC * x1) / zz, yn],
              [CX + (FOC * x1) / zf, yf],
              [CX + (FOC * x0) / zf, yf],
            ];
            let a = 0;
            let col = "255,255,255";
            if (h > 0.8) a = 0.42;
            else if (h > 0.66) {
              a = 0.34;
              col = "201,214,194";
            } else if (h < 0.14) {
              a = 0.22;
              col = "111,147,168";
            }
            if (sweepOn) {
              const mx = (q[0][0] + q[2][0]) / 2 + ((q[0][1] + q[2][1]) / 2 - HZ) * 0.6;
              a += 0.38 * Math.max(0, 1 - Math.abs(mx - sweepX) / 220);
            }
            if (a > 0) {
              ctx.fillStyle = `rgba(${col},${a * fade})`;
              ctx.beginPath();
              ctx.moveTo(q[0][0], q[0][1]);
              q.slice(1).forEach((p) => ctx.lineTo(p[0], p[1]));
              ctx.closePath();
              ctx.fill();
            }
          }
          ctx.strokeStyle = `rgba(255,255,255,${0.55 * fade})`;
          ctx.lineWidth = clamp((yn - HZ) / 140, 0.6, 2.5);
          ctx.beginPath();
          ctx.moveTo(0, yf);
          ctx.lineTo(W, yf);
          ctx.stroke();
        }
        const zfar = 120;
        const zn = 2.2;
        const imax = Math.ceil((960 * zfar) / FOC / TILE) + 1;
        for (let i = -imax; i <= imax; i++) {
          const x = i * TILE;
          ctx.strokeStyle = "rgba(255,255,255,0.4)";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(CX + (FOC * x) / zn, HZ + (FOC * CAM_H) / zn);
          ctx.lineTo(CX + (FOC * x) / zfar, HZ + (FOC * CAM_H) / zfar);
          ctx.stroke();
        }
        // the throne's reflection in the sea, then the throne
        const zr = THRONE_Z - cz;
        const yb = HZ + (FOC * CAM_H) / zr;
        const main = ctx;
        rctx.setTransform(1, 0, 0, 1, 0, 0);
        rctx.clearRect(0, 0, W, H);
        ctx = rctx;
        ctx.save();
        ctx.translate(0, yb * 2);
        ctx.scale(1, -1);
        drawThroneGroup(t, cz);
        ctx.restore();
        const fadeLen = Math.max(40, 1.9 * (FOC / zr));
        const g = rctx.createLinearGradient(0, yb, 0, yb + fadeLen);
        g.addColorStop(0, "rgba(0,0,0,1)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        rctx.globalCompositeOperation = "destination-in";
        rctx.fillStyle = g;
        rctx.fillRect(0, 0, W, H);
        rctx.globalCompositeOperation = "source-over";
        ctx = main;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, yb, W, H - yb);
        ctx.clip();
        ctx.globalAlpha = 0.32;
        ctx.drawImage(reflCanvas, 0, 0);
        ctx.restore();
        drawThroneGroup(t, cz);
      }

      // ---------- one continuous take ----------
      function render(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        if (t >= 10.95) {
          drawSea(t);
        } else if (t >= 8.05) {
          drawWheels(t);
          const ir = 1250 * E.in3(prog(t, 10.2, 10.95));
          if (ir > 1) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(CX, 540, ir, 0, Math.PI * 2);
            ctx.clip();
            drawSea(t);
            ctx.restore();
            ctx.strokeStyle = "#fff6de";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(CX, 540, ir, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else if (t >= 4.65) {
          if (t > 6.9) {
            drawWheels(t);
            drawCrystal(t, true);
          } else {
            drawCrystal(t, false);
          }
        } else {
          drawCrystal(t, false);
          drawSky(t);
        }
      }

      const state = { p: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { p: 1, duration: DUR, ease: "none" }, 0);
      tl.eventCallback("onUpdate", () => render(tl.time()));
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["heavens"] = tl;
    })();
  </script>
</template>
